<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#001529">
  <meta name="description" content="进销存管理系统">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="进销存">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#001529">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <title>进销存管理系统</title>
  <style>
    /* 启动画面 */
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #001529 0%, #002766 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo {
      width: 100px; height: 100px;
      margin-bottom: 24px;
    }
    #splash h1 { color: #fff; font-size: 24px; margin: 0; letter-spacing: 4px; }
    #splash p { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 10px; }
    #splash .loading {
      margin-top: 32px;
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #409eff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 安装提示条 */
    #install-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      padding: 14px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      z-index: 10000;
      border-top: 3px solid #409eff;
    }
    #install-banner.show { display: flex; }
    #install-banner .info { flex: 1; margin-right: 12px; }
    #install-banner .info h3 { margin: 0 0 4px; font-size: 15px; color: #333; }
    #install-banner .info p { margin: 0; font-size: 12px; color: #999; }
    #install-banner .btns { display: flex; gap: 8px; align-items: center; }
    #install-banner button {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: #409eff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    #install-banner .close {
      background: #f5f5f5;
      color: #999;
      width: 36px; height: 36px;
      padding: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <!-- 启动画面 -->
  <div id="splash">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="28" width="16" height="68" rx="6" fill="#409eff"/>
        <rect x="28" y="14" width="16" height="82" rx="6" fill="#67c23a"/>
        <rect x="52" y="0" width="16" height="96" rx="6" fill="#e6a23c"/>
        <rect x="76" y="-14" width="16" height="110" rx="6" fill="#f56c6c"/>
      </svg>
    </div>
    <h1>进销存管理系统</h1>
    <p>加载中...</p>
    <div class="loading"></div>
  </div>

  <!-- PWA安装提示 -->
  <div id="install-banner">
    <div class="info">
      <h3>📥 安装到主屏幕</h3>
      <p>添加到桌面，像原生App一样使用</p>
    </div>
    <div class="btns">
      <button id="install-btn">安装</button>
      <button class="close" id="install-close">✕</button>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Service Worker 的注册统一放在 src/main.js（与移动端同一份实现）

    // 启动画面
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) s.classList.add('hide');
        setTimeout(function() { if (s) s.remove(); }, 400);
      }, 400);
    });

    // PWA 安装提示：**只提示一次**
    //
    // 原来关闭/安装后什么都没记，刷新页面 beforeinstallprompt 又触发，提示条反复出现。
    // 现在记到 localStorage，任何一次明确选择（安装 / 关闭）之后都不再提示。
    // 键名带版本号：将来若想重新提示，改 key 即可，不必让老用户清缓存。
    var INSTALL_KEY = 'pwa_install_prompted_v1';
    var deferredPrompt = null;

    function markPrompted() {
      try {
        localStorage.setItem(INSTALL_KEY, '1');
      } catch (e) {
        /* 隐私模式下 localStorage 可能不可用，忽略即可 */
      }
    }

    function alreadyPrompted() {
      try {
        return localStorage.getItem(INSTALL_KEY) === '1';
      } catch (e) {
        return false;
      }
    }

    /** 已安装（独立窗口打开）就永不再提示 */
    function isStandalone() {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );
    }

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      if (alreadyPrompted() || isStandalone()) return;
      var el = document.getElementById('install-banner');
      if (el) el.classList.add('show');
    });

    /** 收起提示条（元素可能已被移除，做存在性判断） */
    function hideBanner() {
      var el = document.getElementById('install-banner');
      if (el) el.classList.remove('show');
    }

    document.getElementById('install-btn').addEventListener('click', function() {
      // 先记录：无论用户接受还是拒绝，都算「已问过」，不再重复提示
      markPrompted();

      // prompt() 在「非用户手势」或浏览器已自行处理时会抛错；
      // 不用 try/catch 的话会中断后面收起提示条的代码，提示条就卡在屏幕上了。
      try {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice
            .then(function() {
              deferredPrompt = null;
              hideBanner();
            })
            .catch(function() {
              deferredPrompt = null;
              hideBanner();
            });
        } else {
          hideBanner();
        }
      } catch (e) {
        deferredPrompt = null;
        hideBanner();
      }
    });

    document.getElementById('install-close').addEventListener('click', function() {
      markPrompted();
      hideBanner();
    });

    // 装好了就把提示条收掉（比如从浏览器菜单安装的）
    window.addEventListener('appinstalled', function() {
      markPrompted();
      hideBanner();
    });

    // 防止双击缩放
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

    // 防止长按菜单
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
</body>
</html>
