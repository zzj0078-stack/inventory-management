# ============================================================
#  进销存系统 —— Cloudflare Pages + D1
#
#  wrangler.toml 放在仓库根目录：
#    pages_build_output_dir 指向 Vue 构建产物
#    functions/ 目录存放 API（Pages Functions，替代 FastAPI）
#    D1 绑定名 DB，对应 database_name = inventory
#
#  常用命令：
#    D1 结构变更（唯一入口，别再直接 execute schema.sql）：
#      wrangler d1 migrations create inventory "add xxx column"   # 新建迁移文件
#      wrangler d1 migrations list   inventory --remote           # 看有哪些没应用
#      wrangler d1 migrations apply  inventory --remote           # 应用到线上
#      wrangler d1 migrations apply  inventory --local            # 应用到本地
#    数据/初始化：
#      wrangler d1 execute inventory --file=cf/seed.sql --remote
#    部署：
#      wrangler pages deploy frontend/dist --project-name=inventory
#      wrangler pages dev frontend/dist                           （本地联调）
# ============================================================

name = "inventory"
compatibility_date = "2024-09-23"

# Pages：静态产物目录（frontend 的 vite 构建输出）
pages_build_output_dir = "./frontend/dist"

[[d1_databases]]
binding = "DB"
database_name = "inventory"
database_id = "848e0f62-70d6-4d4a-9cb5-d55147f6394e"
# 迁移目录：wrangler d1 migrations 从这里读取按序号排列的 .sql
migrations_dir = "cf/migrations"

# 商品图片存储。
#   Workers 没有文件系统，图片必须放对象存储。
#   R2 需要先在控制台「启用」（还要绑支付方式），KV 不需要，所以用 KV。
#   上限：单值 25 MiB、免费额度 1 GB 存储 / 10 万次读 / 1000 次写每天。
#   对外 URL 仍是 /uploads/products/<名>，与 Python 版一致，前端零改动。
[[kv_namespaces]]
binding = "IMAGES"
id = "44155434db3642028dee0c02106f7cce"

[vars]
# 业务时区（与 backend/app/core/timeutil.py 的 APP_TIMEZONE 保持一致）
APP_TIMEZONE = "Asia/Shanghai"
# JWT 有效期（分钟）
TOKEN_EXPIRE_MINUTES = "480"
